name: Deploy to Vercel

on:
  # ⚠️ 2026-11-03：自动触发已关闭。
  # 事实核对：push 之后线上确实更新了（首页 CTA 从 839px 变成 619px），说明
  # **Vercel 项目自己的 Git 集成在负责自动部署**，本 workflow 是并行的第二条通道。
  # 而这条通道从 10-28 起就一直失败（Could not retrieve Project Settings，
  # 即 VERCEL_ORG_ID / VERCEL_PROJECT_ID 两个 secret 已失效），每次 push 都留一个红叉，
  # 容易让人误判「部署失败」。
  # 因此改为仅手动触发，作为兜底；要恢复自动触发，先修好那两个 secret（与 VERCEL_TOKEN）。
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 必须带 --include=optional：sharp 的原生 libvips 二进制
      # (@img/sharp-libvips-linux-x64) 是可选依赖，CI 默认会省略，
      # 导致部署到 Vercel 的 lambda 运行期 ERR_DLOPEN_FAILED:
      # libvips-cpp.so.8.18.3，/api/share-card 全部 500。
      - run: npm ci --include=optional

      - run: npm run build
        env:
          WAFFO_PRIVATE_KEY: ${{ secrets.WAFFO_PRIVATE_KEY }}
          NEXT_PUBLIC_WAFFO_PRODUCT_DISCOUNTED: ${{ secrets.NEXT_PUBLIC_WAFFO_PRODUCT_DISCOUNTED }}
          NEXT_PUBLIC_WAFFO_PRODUCT_FULL: ${{ secrets.NEXT_PUBLIC_WAFFO_PRODUCT_FULL }}
          NEXT_PUBLIC_WAFFO_PRODUCT_SUBSCRIPTION: ${{ secrets.NEXT_PUBLIC_WAFFO_PRODUCT_SUBSCRIPTION }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}

      # 2026-11-03：部署在 Deploy 步骤失败（构建是好的），报
      #   "Could not retrieve Project Settings. To link your Project, remove the .vercel directory and deploy again."
      # 原因：`npx vercel` 不锁版本，CI 拉到了 65.x —— 新版不再仅凭 VERCEL_ORG_ID / VERCEL_PROJECT_ID
      # 环境变量完成 link，必须先用 `vercel pull` 生成 .vercel/project.json。
      # 两处修改：① 先 pull ② 锁定 CLI 版本（避免下次又跟着新版本漂移）。
      - name: Pull Vercel project settings
        run: npx --yes vercel@65.10.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: npx --yes vercel@65.10.0 --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
