name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build
        env:
          WAFFO_PRIVATE_KEY: ${{ secrets.WAFFO_PRIVATE_KEY }}
          NEXT_PUBLIC_WAFFO_PRODUCT_DISCOUNTED: ${{ secrets.NEXT_PUBLIC_WAFFO_PRODUCT_DISCOUNTED }}
          NEXT_PUBLIC_WAFFO_PRODUCT_FULL: ${{ secrets.NEXT_PUBLIC_WAFFO_PRODUCT_FULL }}
          NEXT_PUBLIC_WAFFO_PRODUCT_SUBSCRIPTION: ${{ secrets.NEXT_PUBLIC_WAFFO_PRODUCT_SUBSCRIPTION }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}

      - name: Deploy to Vercel
        run: |
          echo "Uploading build to Vercel..."
          curl -s -X POST 'https://api.vercel.com/v13/deployments' \
            -H 'Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}' \
            -H 'Content-Type: application/json' \
            -d '{
              "name": "crush-xiangjian",
              "orgId": "${{ secrets.VERCEL_ORG_ID }}",
              "projectId": "${{ secrets.VERCEL_PROJECT_ID }}",
              "files": [{"file": "dist.tar\",\"data": "$(tar -C out -czf - . | base64 -w0)"}],
              "target": "production"
            }' | tee /tmp/vercel-response.json
          echo ""
          echo "=== Deployment Response ==="
          cat /tmp/vercel-response.json | head -c 500
